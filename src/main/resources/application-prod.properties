# Perfil PROD: PostgreSQL 18 (se levanta con docker compose, ver compose.yaml)
# Los valores por defecto coinciden con compose.yaml; se pueden sobreescribir por entorno.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:veterinaria}
spring.datasource.username=${POSTGRES_USER:veterinaria}
spring.datasource.password=${POSTGRES_PASSWORD:veterinaria}
spring.datasource.driver-class-name=org.postgresql.Driver

# update: Hibernate crea/actualiza el esquema y los datos persisten entre arranques
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# La consola H2 no aplica con PostgreSQL
spring.h2.console.enabled=false